[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "simplebrain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.3",
    "litellm>=1.40.0",
    "mcp>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "watchdog>=4.0.0",
    "pydantic>=2.7.0",
    "python-frontmatter>=1.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["simplebrain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
